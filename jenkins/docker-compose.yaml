services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8088:8080"    # Jenkins Web UI (Avoids conflict with host 8080)
      - "50000:50000"  # Jenkins Inbound Agent port
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Docker-in-Docker / Docker CLI access
    networks:
      - jenkins-net

networks:
  jenkins-net:
    driver: bridge
