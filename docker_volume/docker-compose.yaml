version: '3'
services:
  mongodb:
    image: mongo
    ports:
    - 27017:27017
    environment:
    - MONGO_INITDB_ROOT_USERNAME=admin
    - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
    - docvol-network

  mongo-express:
    image: mongo-express
    ports:
    - 8082:8080
    environment:
    - ME_CONFIG_MONGODB_SERVER=mongodb
    - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
    - ME_CONFIG_MONGODB_ADMINPASSWORD=password
    - ME_CONFIG_BASICAUTH_USERNAME=expressadmin
    - ME_CONFIG_BASICAUTH_PASSWORD=expresspassword
    networks:
    - docvol-network

  docvol:
    image: docvol:1.0
    build: .
    ports:
    - 3002:3002
    environment:
    - MONGODB_URI=mongodb://admin:password@mongodb:27017/myapp?authSource=admin
    depends_on:
    - mongodb
    networks:
    - docvol-network

networks:
  docvol-network:
    driver: bridge
