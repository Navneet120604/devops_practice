version: '3'
services:
  mongodb:
    image: mongo
    ports:
    - 27017:27017
    environment:
    - MONGO_INITDB_ROOT_USERNAME=admin
    - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
    - newproc-network

  mongo-express:
    image: mongo-express
    ports:
    - 8081:8081
    environment:
    - ME_CONFIG_MONGODB_SERVER=mongodb
    - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
    - ME_CONFIG_MONGODB_ADMINPASSWORD=password
    - ME_CONFIG_BASICAUTH_USERNAME=expressadmin
    - ME_CONFIG_BASICAUTH_PASSWORD=expresspassword
    networks:
    - newproc-network

  new-proc:
    image: new-proc:1.0
    ports:
    - 3001:3001
    environment:
    - MONGODB_URI=mongodb://admin:password@mongodb:27017/myapp?authSource=admin
    depends_on:
    - mongodb
    networks:
    - newproc-network

networks:
  newproc-network:
    driver: bridge
