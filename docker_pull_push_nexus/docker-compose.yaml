services:
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: always
    ports:
      - "8081:8081"   # Nexus Web Console
      - "8083:8083"   # Docker Hosted Registry (Push / Pull)
      - "8084:8084"   # Docker Group / Proxy Registry
    volumes:
      - nexus-data:/nexus-data
    networks:
      - nexus-network

volumes:
  nexus-data:
    driver: local

networks:
  nexus-network:
    driver: bridge
